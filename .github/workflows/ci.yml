name: CI

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,api,research]"
      - run: python -m ruff format --check src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src/edgestack
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: edgestack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
