feature_definition:
  event: "SEC 8-K item 2.02 acceptance timestamp with a reported diluted EPS observation."
  surprise: "(reported EPS minus the issuer's fourth prior available EPS event) divided by max(abs(lag-4 EPS), 0.25), winsorized to [-10, 10]."
  availability: "First XNYS regular-session open strictly after accepted_at; no close-date approximation."
  pre_event_momentum: "Adjusted-close return over 126 sessions ending before the executable open."
