  minimum_eps_change: [0.0, 0.25, 1.0]
  require_positive_pre_event_momentum: [false, true]
  horizon_sessions: [5, 21, 63]

portfolio_definition:
  weighting: "Equal weight every active eligible issuer; gross exposure capped at 1.0 and unused weight earns cash yield."
  overlap: "Repeated events for one issuer form one binary position; positions remain active for the frozen horizon."
