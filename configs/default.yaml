# EdgeStack default configuration.
# Every value here is validated at startup by edgestack.config.EdgeStackConfig.
# Research / paper-trading only. Nothing in this file enables live trading.

project:
  name: EdgeStack
  timezone: America/New_York
  random_seed: 42

paths:
  data_dir: data
  artifacts_dir: artifacts

universe:
  source: local              # local | stooq | synthetic
  symbols: [SPY, AAPL, MSFT, NVDA, AMZN, GOOGL, META, JPM, XOM, JNJ, PG, UNH, HD, KO, WMT, CSCO]
  benchmark_symbol: SPY
  min_price: 5.0
  min_median_dollar_volume: 5000000
  min_history_sessions: 504
  include_etfs: false
  # The bundled free providers cannot supply point-in-time index membership.
  # Backtests over static symbol lists therefore carry survivorship bias and
  # are flagged prominently in every report.
  point_in_time: false

data:
  calendar: XNYS
  cache_ttl_days: 3
  request_timeout_seconds: 30
  max_retries: 3

signals:
  # A signal computed from information as of session T's close is executable
  # no earlier than session T+execution_delay_sessions' open.
  execution_delay_sessions: 1
  horizons: [1, 2, 3, 5, 10, 20, 40, 60]
  min_effective_sample_size: 100
  min_probability_of_profit: 0.55
  min_expected_net_return: 0.002
  min_conviction_score: 65
  min_reward_to_risk: 1.2
  abstain_on_missing_borrow: true
  max_candidates_per_side: 20

validation:
  method: expanding_walk_forward   # expanding_walk_forward | rolling_walk_forward
  n_folds: 5
  train_min_sessions: 756          # ~3 years
  test_sessions: 252               # ~1 year per fold
  embargo_sessions: 60             # >= max horizon
  final_test_start: "2023-01-01"   # untouched period guarded by TestPeriodGuard
  fdr_alpha: 0.05
  fdr_method: benjamini_hochberg   # benjamini_hochberg | benjamini_yekutieli
  bootstrap_samples: 2000
  block_length_sessions: 20
  min_subperiod_consistency: 0.6   # fraction of folds in which sign must persist

discovery:
  max_condition_depth: 3
  min_support: 50                  # minimum observations per rule per fold
  max_rules_per_batch: 5000
  quantile_bins: [0.1, 0.25, 0.5, 0.75, 0.9]
  horizons: [5, 10, 20]            # discovery searches these; models cover all

costs:
  scenario: CONSERVATIVE           # OPTIMISTIC | BASE | CONSERVATIVE | STRESS
  commission_bps: 0.0
  half_spread_bps: 5.0
  base_slippage_bps: 5.0
  impact_coeff_bps: 10.0           # scaled by participation proxy
  short_borrow_annualized: 0.05
  sec_fee_bps: 0.03

scoring:
  neutral_conviction: 50.0
  logistic_slope: 6.0
  # Per-family contribution caps for evidence aggregation (fractions of total).
  family_cap: 0.4
  within_family_lambda: 0.25
  shrinkage_min_sample: 30

risk:
  max_position_weight: 0.03
  max_sector_weight: 0.20
  max_gross_exposure: 1.50
  max_net_exposure: 0.50
  max_positions: 40
  target_annualized_volatility: 0.12
  max_portfolio_drawdown: 0.15
  atr_stop_multiple: 2.0
  atr_target_multiples: [2.5, 4.0]
  atr_window: 14

monitoring:
  rolling_window_signals: 60
  degrade_posterior_threshold: 0.40   # P(edge still positive) below this -> DEGRADED
  suspend_posterior_threshold: 0.25
  retire_after_suspended_sessions: 126
  calibration_ece_threshold: 0.10

paper:
  live_trading_enabled: false        # hard default; no live adapter ships with EdgeStack
  initial_cash: 100000.0
