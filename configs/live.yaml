# NOTE: legacy research configuration retained for provenance. Legacy edge
# statuses and 2024-2026 results are previously accessed and promotion-incompatible.
# The V2 nightly action path publishes the fixed baseline plus zero-weight ideas.
# Broad point-in-time S&P 500 research configuration (roadmap phases 1-4).
# Universe symbols are supplied by the PIT membership module, not this list.

project:
  name: EdgeStack-live
  timezone: America/New_York
  random_seed: 42

paths:
  data_dir: data
  artifacts_dir: artifacts

universe:
  source: yahoo_stooq             # Yahoo primary, per-symbol Stooq failover
  symbols: [SPY]                  # placeholder; PIT module supplies members
  benchmark_symbol: SPY
  min_price: 5.0
  min_median_dollar_volume: 5000000
  min_history_sessions: 504
  include_etfs: false
  point_in_time: true             # membership is PIT; price coverage is measured

data:
  calendar: XNYS
  cache_ttl_days: 30
  request_timeout_seconds: 30
  max_retries: 2

signals:
  execution_delay_sessions: 1
  horizons: [1, 5, 10]
  min_effective_sample_size: 200
  min_probability_of_profit: 0.52
  min_expected_net_return: 0.0
  min_conviction_score: 0
  min_reward_to_risk: 1.0
  abstain_on_missing_borrow: true
  max_candidates_per_side: 10

validation:
  method: expanding_walk_forward
  n_folds: 2                      # inner folds (nested outer windows are yearly)
  train_min_sessions: 756
  test_sessions: 252
  embargo_sessions: 10
  final_test_start: "2026-12-31"
  fdr_alpha: 0.05
  fdr_method: benjamini_hochberg
  bootstrap_samples: 200
  block_length_sessions: 20
  min_subperiod_consistency: 0.5

discovery:
  max_condition_depth: 2
  min_support: 100
  max_rules_per_batch: 1500
  quantile_bins: [0.1, 0.25, 0.5, 0.75, 0.9]
  horizons: [10]

costs:
  scenario: CONSERVATIVE
  commission_bps: 0.0
  half_spread_bps: 5.0
  base_slippage_bps: 5.0
  impact_coeff_bps: 10.0
  short_borrow_annualized: 0.05
  sec_fee_bps: 0.03

scoring:
  neutral_conviction: 50.0
  logistic_slope: 6.0
  family_cap: 0.4
  within_family_lambda: 0.25
  shrinkage_min_sample: 30

risk:
  max_position_weight: 0.02
  max_sector_weight: 0.20
  max_gross_exposure: 1.00
  max_net_exposure: 0.60
  max_positions: 50
  target_annualized_volatility: 0.12
  max_portfolio_drawdown: 0.15
  atr_stop_multiple: 2.0
  atr_target_multiples: [2.5, 4.0]
  atr_window: 14

monitoring:
  rolling_window_signals: 60
  degrade_posterior_threshold: 0.40
  suspend_posterior_threshold: 0.25
  retire_after_suspended_sessions: 126
  calibration_ece_threshold: 0.10

paper:
  live_trading_enabled: false
  initial_cash: 100000.0


